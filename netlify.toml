# Netlify settings. The site is plain HTML/CSS/JS, so there is no build step.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Old Square Online page addresses can be pointed here later, e.g.
# [[redirects]]
#   from = "/s/order"
#   to = "/#quote"
#   status = 301
