<!-- Kreung LA: Upcoming Events (for a Square Online "Embed code" section)
     Paste this whole file into the embed box. Settings are at the top of the <script>.
     Data: https://kreung-site.netlify.app/api/events (our Google Calendar, refreshed hourly). -->
<div class="kla-events" data-kreung-events>
  <h2 class="kla-events__heading">Upcoming events</h2>
  <p class="kla-events__status" role="status" aria-live="polite">Loading upcoming events\u2026</p>
  <ul class="kla-events__list" hidden></ul>
  <noscript><p class="kla-events__status">See our weekly markets and pop-ups on Instagram: <a href="https://www.instagram.com/kreung_la">@kreung_la</a>.</p></noscript>
</div>

<style>
  .kla-events {
    --kla-ink: #1c1a17;
    --kla-cream: #fff6e5;
    --kla-yellow: #f7d63b;
    --kla-teal-dark: #1d6670;
    --kla-pink: #bb3e6f;
    --kla-muted: #4a4540;
    box-sizing: border-box;
    max-width: 640px;
    margin: 0 auto;
    padding: 4px;
    color: var(--kla-ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    text-align: left;
  }
  .kla-events *, .kla-events *::before, .kla-events *::after { box-sizing: inherit; }
  .kla-events__heading {
    margin: 0 0 12px;
    font-size: 1.5rem;
    line-height: 1.15;
    font-weight: 900;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--kla-ink);
  }
  .kla-events__heading:empty { display: none; }
  .kla-events__status { margin: 0; padding: 14px 16px; background: var(--kla-cream); border: 2px solid var(--kla-ink); border-radius: 10px; }
  .kla-events__list { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .kla-events__list[hidden] { display: none; }
  .kla-event {
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 12px;
    padding: 12px;
    background: var(--kla-cream);
    border: 2px solid var(--kla-ink);
    border-radius: 10px;
    box-shadow: 4px 4px 0 var(--kla-pink);
  }
  .kla-event__stamp {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    align-self: start;
    min-height: 72px;
    padding: 6px 2px;
    background: var(--kla-yellow);
    color: var(--kla-ink);
    border: 2px solid var(--kla-ink);
    border-radius: 8px;
    text-align: center;
    line-height: 1.05;
  }
  .kla-event__dow, .kla-event__mon { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; }
  .kla-event__day { font-size: 1.6rem; font-weight: 900; }
  .kla-event__body { min-width: 0; }
  .kla-event__title { margin: 0 0 2px; font-size: 1.1rem; line-height: 1.2; font-weight: 800; color: var(--kla-ink); overflow-wrap: anywhere; }
  .kla-event__when { margin: 0; font-weight: 700; color: var(--kla-teal-dark); }
  .kla-event__where { margin: 2px 0 0; color: var(--kla-muted); overflow-wrap: anywhere; }
  .kla-event__desc { margin: 6px 0 0; color: var(--kla-ink); white-space: pre-line; overflow-wrap: anywhere; font-size: 0.95rem; }
  .kla-events a {
    color: var(--kla-teal-dark);
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .kla-events a:hover { color: var(--kla-pink); }
  .kla-events a:focus-visible { outline: 3px solid var(--kla-pink); outline-offset: 2px; border-radius: 3px; }
  .kla-event__directions { display: inline-block; margin-top: 8px; padding: 4px 0; }
  .kla-sr {
    position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  @media (min-width: 520px) {
    .kla-event { grid-template-columns: 76px 1fr; gap: 16px; padding: 14px 16px; }
    .kla-event__day { font-size: 1.9rem; }
  }
</style>

<script>
(function () {
  // ===== Settings (change these) =====
  var SHOW = 3;            // How many events to show. 0 = show all (next 8 weeks).
  var HEADING = 'Upcoming events'; // Title above the list. Use '' for no title.
  var API_URL = 'https://kreung-site.netlify.app/api/events';
  var INSTAGRAM_URL = 'https://www.instagram.com/kreung_la';
  // ===================================

  var TZ = 'America/Los_Angeles';
  var script = document.currentScript;
  var roots = document.querySelectorAll('[data-kreung-events]:not([data-kla-ready])');
  // Use the box this script was pasted with (the nearest one above it), else the first unused one.
  var root = null;
  if (script) {
    for (var i = 0; i < roots.length; i++) {
      if (roots[i].compareDocumentPosition(script) & Node.DOCUMENT_POSITION_FOLLOWING) root = roots[i];
    }
  }
  root = root || roots[0];
  if (!root) return;
  root.setAttribute('data-kla-ready', '');

  var heading = root.querySelector('.kla-events__heading');
  var statusEl = root.querySelector('.kla-events__status');
  var list = root.querySelector('.kla-events__list');
  var headingId = 'kla-events-' + Math.random().toString(36).slice(2, 8);
  heading.textContent = HEADING;
  if (HEADING) { heading.id = headingId; list.setAttribute('aria-labelledby', headingId); }
  else list.setAttribute('aria-label', 'Upcoming events');

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function fmt(date, opts) {
    opts.timeZone = opts.timeZone || TZ;
    return new Intl.DateTimeFormat('en-US', opts).format(date);
  }
  // All-day dates come as "YYYY-MM-DD"; read them as calendar days, not instants.
  function dayOnly(s) { var p = s.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2], 12)); }
  function shortTime(d) {
    var parts = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit', hour12: true }).formatToParts(d);
    var h = '', m = '', ap = '';
    parts.forEach(function (p) { if (p.type === 'hour') h = p.value; if (p.type === 'minute') m = p.value; if (p.type === 'dayPeriod') ap = p.value.toUpperCase(); });
    return { text: (m === '00' ? h : h + ':' + m), ap: ap };
  }
  function timeEl(d, iso, withAp) {
    var t = shortTime(d);
    var n = el('time', null, t.text + (withAp ? ' ' + t.ap : ''));
    n.setAttribute('datetime', iso);
    return { node: n, ap: t.ap };
  }

  function card(ev) {
    var allDay = !!ev.allDay;
    var start = allDay ? dayOnly(ev.start) : new Date(ev.start);
    var end = ev.end ? (allDay ? dayOnly(ev.end) : new Date(ev.end)) : null;
    var dayTz = allDay ? 'UTC' : TZ;
    var dateIso = allDay ? ev.start : ev.start.slice(0, 10);

    var li = el('li');
    var art = el('article', 'kla-event');
    li.appendChild(art);

    var stamp = el('div', 'kla-event__stamp');
    stamp.setAttribute('aria-hidden', 'true');
    stamp.appendChild(el('span', 'kla-event__dow', fmt(start, { timeZone: dayTz, weekday: 'short' })));
    stamp.appendChild(el('span', 'kla-event__day', fmt(start, { timeZone: dayTz, day: 'numeric' })));
    stamp.appendChild(el('span', 'kla-event__mon', fmt(start, { timeZone: dayTz, month: 'short' })));
    art.appendChild(stamp);

    var body = el('div', 'kla-event__body');
    art.appendChild(body);
    body.appendChild(el('h3', 'kla-event__title', ev.title));

    var when = el('p', 'kla-event__when');
    var dateEl = el('time', null, fmt(start, { timeZone: dayTz, weekday: 'short', month: 'short', day: 'numeric' }));
    dateEl.setAttribute('datetime', dateIso);
    when.appendChild(dateEl);
    if (allDay) {
      if (end && ev.end !== ev.start) {
        when.appendChild(document.createTextNode(' \u2013 '));
        var endDate = el('time', null, fmt(end, { timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric' }));
        endDate.setAttribute('datetime', ev.end);
        when.appendChild(endDate);
      }
      when.appendChild(document.createTextNode(' \u00b7 All day'));
    } else {
      when.appendChild(document.createTextNode(' \u00b7 '));
      if (end && ev.end !== ev.start) {
        var sameAp = shortTime(start).ap === shortTime(end).ap;
        var sameDay = fmt(start, { dateStyle: 'short' }) === fmt(end, { dateStyle: 'short' });
        when.appendChild(timeEl(start, ev.start, !(sameAp && sameDay)).node);
        when.appendChild(document.createTextNode('\u2013'));
        when.appendChild(timeEl(end, ev.end, true).node);
      } else {
        when.appendChild(timeEl(start, ev.start, true).node);
      }
    }
    body.appendChild(when);

    if (ev.location) body.appendChild(el('p', 'kla-event__where', ev.location));
    if (ev.description) body.appendChild(el('p', 'kla-event__desc', ev.description));

    if (ev.mapsUrl) {
      var a = el('a', 'kla-event__directions', 'Get directions');
      a.href = ev.mapsUrl;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.appendChild(el('span', 'kla-sr', ' to ' + (ev.location || ev.title) + ' (opens in a new tab)'));
      body.appendChild(a);
    }
    return li;
  }

  function showEmpty() {
    list.hidden = true;
    statusEl.textContent = '';
    statusEl.appendChild(document.createTextNode('No events on the calendar right now. Follow us on Instagram for our next markets and pop-ups: '));
    var a = el('a', null, '@kreung_la');
    a.href = INSTAGRAM_URL;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.appendChild(el('span', 'kla-sr', ' on Instagram (opens in a new tab)'));
    statusEl.appendChild(a);
    statusEl.appendChild(document.createTextNode('.'));
  }

  function render(events) {
    var now = Date.now();
    events = (events || []).filter(function (e) {
      if (!e || !e.start || !e.title) return false;
      var end = e.allDay ? dayOnly(e.end || e.start).getTime() + 12 * 3600e3 : new Date(e.end || e.start).getTime();
      return end > now; // hide anything that ended since the feed was cached
    });
    if (SHOW > 0) events = events.slice(0, SHOW);
    if (!events.length) return showEmpty();
    list.textContent = '';
    events.forEach(function (e) { list.appendChild(card(e)); });
    list.hidden = false;
    statusEl.hidden = true;
    statusEl.textContent = '';
  }

  var done = false;
  var timer = setTimeout(function () { if (!done) { done = true; showEmpty(); } }, 10000);
  fetch(API_URL, { headers: { Accept: 'application/json' } })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) { if (done) return; done = true; clearTimeout(timer); render(data && data.events); })
    .catch(function () { if (done) return; done = true; clearTimeout(timer); showEmpty(); });
})();
</script>
